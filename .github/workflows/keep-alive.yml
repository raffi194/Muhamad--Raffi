name: Supabase Keep Alive

on:
  schedule:
    # Jalan setiap hari jam 00:00 UTC (07:00 WIB)
    - cron: "0 0 * * *"
  workflow_dispatch: # Bisa dijalankan manual tombolnya

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Database
        # Project ID sudah dimasukkan di bawah ini (lpvtqlplrncowkbyjdsd)
        run: |
          curl -X GET 'https://lpvtqlplrncowkbyjdsd.supabase.co/rest/v1/projects?select=id&limit=1' \
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"